<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1a">
<title>明日债 · Tomorrow's Debt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hpwrap"><div id="hpfill"></div><span id="hptext"></span></div>
      <div id="p2wrap" class="hidden"><div id="p2fill"></div><span id="p2text"></span></div>
      <div id="scene-label"></div>
      <div id="wave-label"></div>
    </div>
    <div class="hud-right">
      <div id="debt-label" title="未偿命债">命债 <b id="debt-count">0</b></div>
      <div id="score-label">时尘 <b id="score-count">0</b></div>
      <button id="btn-mute" class="mini-btn" aria-label="静音">♪</button>
      <button id="btn-pause" class="mini-btn" aria-label="暂停">Ⅱ</button>
    </div>
    <div id="debt-alert" class="hidden">它来讨债了</div>
  </div>

  <!-- 技能按钮（大点击区） -->
  <div id="skills" class="hidden">
    <button class="skill-btn" data-skill="nova"><span class="sk-name">阴爆</span><span class="sk-key">J · 借命</span><span class="sk-cd"></span></button>
    <button class="skill-btn" data-skill="blades"><span class="sk-name">纸人</span><span class="sk-key">K · 借命</span><span class="sk-cd"></span></button>
    <button class="skill-btn" data-skill="chrono"><span class="sk-name">凝时</span><span class="sk-key">L · 借命</span><span class="sk-cd"></span></button>
    <button id="btn-dash" class="skill-btn dash"><span class="sk-name">冲刺</span><span class="sk-key">空格</span><span class="sk-cd"></span></button>
  </div>

  <!-- 主菜单 -->
  <div id="menu" class="overlay">
    <h1>明日债</h1>
    <p class="subtitle">Tomorrow's Debt</p>
    <p class="intro">你要把一封契，送给死去的未来的自己。<br>你没有武器，只有一支朱砂笔——绕着邪祟走满一圈，印合上，才封得住。<br>借命的咒随借随用，但借过的每一咒，讨债影都会拿来对付你。</p>
    <button id="btn-start" class="big-btn">开始送契</button>
    <button id="btn-endless" class="big-btn ghost hidden">无尽模式</button>
    <div id="online-box">
      <div class="online-row">
        <button id="btn-host" class="mini-wide">建房联机</button>
        <input id="room-input" maxlength="4" placeholder="4 位房码" autocomplete="off">
        <button id="btn-join" class="mini-wide">加入房间</button>
      </div>
      <p id="net-status">双人合作：建房把房码给同伴，或输入同伴的房码加入</p>
    </div>
    <p class="howto">电脑：WASD 移动绕圈 · 空格冲刺（会断印）· J/K/L 借咒<br>同屏双人：开始后按 Enter 加入，P2 用方向键移动、小键盘 1/2/3 借咒、右 Shift 冲刺<br>手机：左半屏摇杆绕圈 · 右侧大按钮</p>
    <p id="best-line" class="best"></p>
  </div>

  <!-- 章节卡 -->
  <div id="chapter" class="overlay hidden">
    <h2 id="chapter-title"></h2>
    <p id="chapter-text"></p>
    <button id="btn-chapter" class="big-btn">进入</button>
  </div>

  <!-- 升级三选一 -->
  <div id="upgrade" class="overlay hidden">
    <h2>时尘凝形 · 三选一</h2>
    <div id="upgrade-cards"></div>
  </div>

  <!-- 结算 -->
  <div id="end" class="overlay hidden">
    <h2 id="end-title"></h2>
    <p id="end-stats"></p>
    <button id="btn-retry" class="big-btn">再来一局</button>
    <button id="btn-tomenu" class="big-btn ghost">回主菜单</button>
  </div>

  <div id="pause" class="overlay hidden">
    <h2>已暂停</h2>
    <button id="btn-resume" class="big-btn">继续</button>
    <button id="btn-quit" class="big-btn ghost">放弃本局</button>
  </div>
</div>
<script src="peerjs.min.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
</body>
</html>
